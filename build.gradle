plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "GitHubPackages"
        url = uri("https://maven.pkg.github.com/tef-austral/printscript")
        credentials {
            username = project.findProperty("gpr.user") ?: System.getenv("USERNAME")
            password = project.findProperty("gpr.key") ?: System.getenv("TOKEN")
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

test {
    minHeapSize = "5m" // initial heap size
    maxHeapSize = "7m" // maximum heap size
}

dependencies {
    testImplementation 'junit:junit:4.13.1'

    implementation 'com.github.tef-austral:ast:1.1.0'
    implementation 'com.github.tef-austral:token:1.1.0'
    implementation 'com.github.tef-austral:common:1.1.0'
    implementation 'com.github.tef-austral:reader:1.1.0'
    implementation 'com.github.tef-austral:lexer:1.1.1'
    implementation 'com.github.tef-austral:parser:1.1.0'
    implementation 'com.github.tef-austral:interpreter:1.1.0'
    implementation 'com.github.tef-austral:formatter:1.1.0'
    implementation 'com.github.tef-austral:analyzer:1.1.1'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
}

test {
    environment "BEST_FOOTBALL_CLUB", "San Lorenzo"
    useJUnit()
}